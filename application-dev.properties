
#User
spring.data.mongodb.uri=mongodb://root:root@localhost:27017/micro?authSource=admin

#Product
spring.r2dbc.url=r2dbc:mysql://localhost:3306/reactivedb
spring.r2dbc.username=root
spring.r2dbc.password=root

#Order
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/micodb
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# Automatically update database schema
spring.jpa.hibernate.ddl-auto=update


